# Publish every package in the repository (cli/, mcp/) to PyPI and create a GitHub Release when a
# vX.Y.Z tag is pushed. Packages are detected from the repository, so adding one needs no change here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag matches every version in the repository
        run: python3 .github/scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Tagged commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Packages to publish
        id: packages
        run: |
          packages=$(for dir in cli mcp; do if [ -f "$dir/pyproject.toml" ]; then echo "$dir"; fi; done | jq -R . | jq -cs .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

  test:
    needs: verify
    if: needs.verify.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.verify.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install --python python3.13 poetry==2.5.1
      - name: Lint, type-check and test
        run: |
          poetry install --no-interaction
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
          poetry run pytest

  build:
    needs: [verify, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.verify.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install --python python3.13 poetry==2.5.1
      - name: Build and smoke-test
        run: |
          poetry build
          python3.13 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          command=$(python3.13 -c 'import tomllib; print(next(iter(tomllib.load(open("pyproject.toml", "rb"))["project"]["scripts"])))')
          "/tmp/smoke/bin/$command" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.package }}
          path: ${{ matrix.package }}/dist/
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    strategy:
      # Publish every package that can be published; a failed one is re-run on its own.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.verify.outputs.packages) }}
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [verify, publish]
    # Runs after a successful publish, or right after verify when there is nothing to publish.
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.verify.outputs.packages == '[]' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verify.outputs.packages != '[]'
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          if [ -d dist ]; then args+=(dist/*); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
